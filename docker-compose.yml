version: "3.9"
services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: stockflow_db
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backend/migrations:/docker-entrypoint-initdb.d
    
volumes:
  pgdata: